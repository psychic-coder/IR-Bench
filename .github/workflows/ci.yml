name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend lint + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
      - name: Install (CPU torch + pinned lock file)
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e backend
          pip check
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        working-directory: backend
        run: python -m pytest -p no:cacheprovider ../tests

  frontend:
    name: frontend lint + typecheck + tests + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: images + smoke benchmark + API/UI/load smoke
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare .env and writable volumes
        run: |
          cp .env.example .env
          sed -i "s/^APP_UID=.*/APP_UID=$(id -u)/; s/^APP_GID=.*/APP_GID=$(id -g)/" .env
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p data results
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
      - name: Build images
        run: docker compose --profile benchmark build
      - name: Frontend test stage
        run: docker build -f docker/frontend.Dockerfile --target test .
      - name: Backend tests inside the image
        run: |
          docker compose run --rm --no-deps -e QDRANT_URL=:memory: api \
            python -m pytest -p no:cacheprovider -c /app/backend/pyproject.toml --rootdir /app /app/tests -q
      - name: Fast-mode benchmark smoke run (toy data, DATASET_SUBSET)
        run: |
          BENCH_CONFIG=ci DATASET_SUBSET=60 docker compose --profile benchmark run --rm benchmark
          test -s results/results.json
          test -s results/results.csv
          test -s results/summary.md
          test -s results/hard_queries.json
          ls results/plots/*.png
          git diff --stat README.md
      - name: Start the stack on toy data and wait for readiness
        run: |
          API_CONFIG=api.ci.yaml docker compose up -d --build
          python3 scripts/wait_for_ready.py --url http://localhost:8000 --timeout 600
      - name: API + UI smoke
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/configs | python3 -m json.tool | head -20
          IMG=$(ls data/toy_a/jpg/*.jpg | head -1)
          curl -fsS -F "image=@${IMG};type=image/jpeg" -F backbone=hsv_hist -F index=hnsw -F rerank=aqe+sv -F k=5 \
            http://localhost:8000/search | python3 -m json.tool | head -40
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/backend/ready
          curl -fsS -o /dev/null http://localhost:3000/search
          curl -fsS http://localhost:8000/metrics | grep irbench_ready
      - name: Load test (short)
        run: |
          K6_BACKBONE=hsv_hist K6_INDEX=hnsw K6_MAX_VUS=4 K6_DURATION_SCALE=0.1 \
            docker compose --profile loadtest run --rm loadtest
          test -s results/loadtest/summary-latest.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            results/
            !results/rankings/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile benchmark --profile loadtest down -v
